name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-test-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Baixar Godot 4.7.2
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip godot-bin -Force

      - name: Importar projeto (1a vez)
        shell: pwsh
        run: |
          & ./godot-bin/Godot_v4.7.2-stable_win64.exe --headless --path godot --import --quit
          exit 0

      - name: Executar run_checks (CI)
        shell: pwsh
        run: powershell -File tools/run_checks.ps1 -CI